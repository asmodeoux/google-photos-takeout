name: Feature request
description: A change that would make a Takeout easier to live with.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: The change you want
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - dates
        - Live Photos
        - albums
        - something else
    validations:
      required: true
