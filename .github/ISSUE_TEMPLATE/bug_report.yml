name: Bug report
description: Something in the library is wrong, missing, or dated badly.
title: "[bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: takeout version
      description: Output of `./takeout version` (Windows `.\takeout.exe version`).
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and results disk
      placeholder: Windows 11, results on an exFAT USB disk
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: takeout doctor
      description: Output of `./takeout doctor` (Windows `.\takeout.exe doctor`). It shows tool versions and folders, never photo names. Edit your user name out of the paths if you like.
      render: text
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: counts
    attributes:
      label: Report counts
      description: Paste the counts from results/.takeout/report.json. Delete every url field first. Do not paste GPS coordinates.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not attach photos, videos, zip files, or unredacted GPS.
          required: true
