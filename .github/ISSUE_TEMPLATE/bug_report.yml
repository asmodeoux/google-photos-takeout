name: Bug report
description: Something in the library is wrong, missing, or dated badly.
title: "[bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: takeout --version
      description: Output of `./takeout version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Apple silicon
    validations:
      required: true
  - type: input
    id: exiftool
    attributes:
      label: ExifTool version
      description: Output of `exiftool -ver`.
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: counts
    attributes:
      label: Report counts
      description: Paste the counts from results/.takeout/report.json. Delete every url field first. Do not paste GPS coordinates.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not attach photos, videos, zip files, or unredacted GPS.
          required: true
