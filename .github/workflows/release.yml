name: release

# Pushing a tag such as v1.0.0 builds the binaries and publishes a GitHub
# Release with them. The tag must match internal/version/version.go.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release; nothing else in this repository writes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"

      - name: Tag matches the version in the code
        run: |
          set -eu
          ver="${GITHUB_REF_NAME#v}"
          grep -q "var Version = \"$ver\"" internal/version/version.go || {
            echo "tag $GITHUB_REF_NAME does not match internal/version/version.go" >&2; exit 1; }
          grep -q "^## $ver " CHANGELOG.md || { echo "CHANGELOG.md has no section for $ver" >&2; exit 1; }

      - name: Vet and unit tests
        run: go vet ./... && go test ./...

      - name: Build and package
        run: |
          set -eu
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in windows/amd64 windows/arm64 darwin/arm64 darwin/amd64 linux/amd64; do
            os=${target%/*}; arch=${target#*/}
            name="takeout-$GITHUB_REF_NAME-$os-$arch"
            dir="build/$name"
            exe=takeout; [ "$os" = windows ] && exe=takeout.exe
            mkdir -p "$dir"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/asmodeoux/google-photos-takeout/internal/version.Version=$ver" \
              -o "$dir/$exe" ./cmd/takeout
            cp scripts/README-download.txt LICENSE "$dir/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          test "$(build/takeout-$GITHUB_REF_NAME-linux-amd64/takeout version)" = "$ver"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist
          cat dist/SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        run: |
          set -eu
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="## $ver " 'index($0, v) == 1 { on = 1; next } /^## / && on { exit } on' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ## Download

          Pick the file for your system, extract it, and follow `README-download.txt` inside, or the [README](https://github.com/asmodeoux/google-photos-takeout#tutorial). You also need ExifTool. The binaries are not code-signed yet: on Windows run `Unblock-File .\takeout.exe`, and on macOS run `xattr -d com.apple.quarantine takeout`. `SHA256SUMS.txt` lists each file's checksum.
          NOTES
          test -s notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "takeout $GITHUB_REF_NAME" --notes-file notes.md
